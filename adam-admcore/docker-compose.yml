version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: adam-admcore_web_1
      APP_PORT: 8080
      # Public website: visitors must NOT be asked for the Umbrel login
      PROXY_AUTH_ADD: "false"

  web:
    build:
      context: ${APP_DATA_DIR}
    # Rebuilt on every start, so after an update the new program really runs.
    pull_policy: build
    restart: on-failure
    stop_grace_period: 5s
    user: "1000:1000"
    environment:
      DATA_DIR: /data
      TZ: Europe/Budapest
      APP_VERSION: "5.1.0"
      # Where new requests are handed over (the core Irányítópult app, internal port only)
      DASH_INGEST: http://adam-core-iranyitopult_web_1:9097/ingest
    volumes:
      - ${APP_DATA_DIR}/data:/data
