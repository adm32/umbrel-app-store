releaseNotes: >-
  5.1.1 – a Google pontosabban felismeri a márkanevet (Zala Studio, ZalaStudio, zalastudio).
  5.1.0 – újra van kártyás fizetés. Az ügyfél választhat: bankkártya (Stripe, automatikus havi vagy éves levonás) vagy banki átutalás. Az ÁSZF és az adatkezelési tájékoztató ezzel bővült (Stripe, Számlázz.hu), a láblécben újra ott az „Előfizetés kezelése”.
  5.0.1 – a vállalkozás adatai (székhely, nyilvántartási szám, adószám) az impresszumban és az ÁSZF-ben. Az árak ÁFA nélküli végösszegek (alanyi adómentes).
  5.0.0 – megújult megjelenés. A Munkáink telefonon lapozható sor (a következő kártya bekukucskál),
  gépen három egyforma kártya, mindegyiken címkével (Étterem, Szépségszalon, Borbély). A három lépés
  idővonal lett, az ingyenes lépéseken „Ingyenes” jelzéssel. A Kérdések gépen kéthasábos: bal oldalt a
  cím és az e-mail-cím, jobb oldalt a kérdések. A régi lábléc stílusai és a nem használt színváltozók
  kikerültek a kódból.
