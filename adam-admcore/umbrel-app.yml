releaseNotes: >-
  Új név és arculat: Zala Studio (zalastudio.hu). Új logó és ikonok, letisztultabb főoldal sötét, mozgó nyitóképpel és kevesebb apró szöveggel; Kánya Márk (Lenti) is szerepel az oldalon. Fizetés banki átutalással (ÁSZF és adatvédelem frissítve). Az admcore.hu magától a zalastudio.hu-ra irányít, amint az első látogató megérkezik az új domainre.
