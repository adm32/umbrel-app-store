manifestVersion: 1
id: adam-admcore
category: social
name: core (admcore.hu)
version: "2.2.5"
tagline: core webstúdió – weboldalak vállalkozásoknak
icon: https://raw.githubusercontent.com/adm32/umbrel-app-store/main/adam-admcore/icon.svg
description: >-
  The admcore.hu website: warm, phone-first one-pager with a live demo phone,
  a step-by-step website planner (visitors design their site and request a
  free demo), portfolio, prices, FAQ, impresszum and privacy policy.
  Hungarian, no cookies, fonts served locally.


  Requests from the planner go to the "core Irányítópult" app (install it
  too). Until it is reachable they wait in this app and are retried every
  minute. The site also counts visitors without cookies for the Irányítópult.


  To put it on admcore.hu, point a Cloudflare Tunnel public hostname at
  http://<umbrel-ip>:4760.
developer: Adam
website: https://admcore.hu
