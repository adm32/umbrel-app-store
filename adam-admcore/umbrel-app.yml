releaseNotes: >-
  5.3.2 – új ÁSZF a hatályos jogszabályok szerint (2026. november 19-étől): pontos békéltető testületi és
  fogyasztóvédelmi tájékoztatás, fogyasztói elállás nyilatkozatmintával, a szerződéskötés lépései,
  jogellenes tartalom bejelentése (DSA), adatfeldolgozási megállapodás az ügyfelek oldalaira, kódátadás.
  5.3.1 – a Google Cégprofil beállítása kikerült az oldalról (csomagok, tervező, kiemelések).
  5.3.0 – kézre állóbb oldal. Gyorsabb, rövidebb animációk; gépen a kártya, amin az egér van, kiemelkedik,
  a többi halványabb. A tervezőben a ritkább lehetőségek egy „További lehetőségek” gomb mögött vannak, a
  beírt telefonszámot, e-mail-címet, linket és települést az oldal rendbe teszi (pl. „06/30-123 45 67” →
  „+36 30 123 4567”). A kis linkek nagyobb területen koppinthatók. A nyitókép telefonja két kör után
  megáll, ami sokszor ismétlődik, az egyre kevésbé mozog.
  5.2.1 – Facebook- és TikTok-link a láblécben (Kapcsolat), és a Google is tudja, hogy ezek a Zala Studio oldalai.
  5.2.0 – letisztultabb, gyorsabb oldal. Kikerültek a csak díszítő mozgások (csillogó gombok, forgó
  keret az ajánlott csomagon, lebegő fények), a hero gyorsabban betölt. Konkrétabb címek (pl. „Havonta
  3 490 Ft-tól. Minden benne.”), az „Ez minden oldalban benne van” rész új elrendezést kapott: a fő
  előny nagyobb, és egy valódi részletet mutat a Vadvirág oldalából. Erősebb szövegkontraszt, egységes
  ikonok és betűméretek, az árak egymás alatt, egy vonalban. Fizetéskor és az „Előfizetés kezelése”
  linknél látszik, hogy a Stripe oldala töltődik, a gomb nem nyomható meg kétszer.
  5.1.1 – a Google pontosabban felismeri a márkanevet (Zala Studio, ZalaStudio, zalastudio).
  5.1.0 – újra van kártyás fizetés. Az ügyfél választhat: bankkártya (Stripe, automatikus havi vagy éves levonás) vagy banki átutalás. Az ÁSZF és az adatkezelési tájékoztató ezzel bővült (Stripe, Számlázz.hu), a láblécben újra ott az „Előfizetés kezelése”.
  5.0.1 – a vállalkozás adatai (székhely, nyilvántartási szám, adószám) az impresszumban és az ÁSZF-ben. Az árak ÁFA nélküli végösszegek (alanyi adómentes).
  5.0.0 – megújult megjelenés. A Munkáink telefonon lapozható sor (a következő kártya bekukucskál),
  gépen három egyforma kártya, mindegyiken címkével (Étterem, Szépségszalon, Borbély). A három lépés
  idővonal lett, az ingyenes lépéseken „Ingyenes” jelzéssel. A Kérdések gépen kéthasábos: bal oldalt a
  cím és az e-mail-cím, jobb oldalt a kérdések. A régi lábléc stílusai és a nem használt színváltozók
  kikerültek a kódból.
