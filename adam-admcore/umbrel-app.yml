releaseNotes: >-
  Süti-ablak: a látogató eldöntheti, hogy megjegyezhetjük-e („Rendben” vagy „Nem kérem”). Hozzájárulás esetén egy látogatói azonosító süti látja, ha valaki visszatér, és hogy mit nézett meg; ha bemutatót kér, ez a kéréssel együtt megjelenik az Irányítópultban. „Nem kérem” esetén nincs süti, a választás bármikor módosítható a „Süti-beállítások” linkkel minden oldal alján. Az adatvédelmi tájékoztató ennek megfelelően frissült.
