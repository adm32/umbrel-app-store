manifestVersion: 1
id: adam-admcore
category: social
name: Zala Studio (zalastudio.hu)
version: "3.2.0"
tagline: Zala Studio – weboldalak vállalkozásoknak
icon: https://raw.githubusercontent.com/adm32/umbrel-app-store/main/adam-admcore/icon.svg
description: >-
  The Zala Studio website (zalastudio.hu; admcore.hu redirects here): phone-first one-pager with a dark hero and a live demo phone,
  a step-by-step website planner (visitors design their site and request a
  free demo), portfolio, prices, FAQ, impresszum and privacy policy.
  Hungarian, no cookies, fonts served locally.


  Requests from the planner go to the "Zala Studio Irányítópult" app (install it
  too). Until it is reachable they wait in this app and are retried every
  minute. The site also counts visitors without cookies for the Irányítópult.


  To put it online, point a Cloudflare Tunnel public hostname (admcore.hu,
  later zalastudio.hu) at http://<umbrel-ip>:4760. Once the first visit
  arrives on zalastudio.hu, admcore.hu redirects there automatically.
