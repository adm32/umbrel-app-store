<!doctype html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/auth.css">
<title>Jelszó beállítása – core Irányítópult</title>
</head><body>
<form method="post" action="/setup">
  <img class="ic" src="/icon.svg" alt="">
  <h1>Jelszó beállítása</h1>
  <p>Az Irányítópult ezentúl csak ezzel a jelszóval nyílik meg.</p>
  <div class="grp">
    <input type="password" name="jelszo" autocomplete="new-password" placeholder="Új jelszó" minlength="8" required autofocus aria-label="Új jelszó" {{disabled}}>
    <input type="password" name="jelszo2" autocomplete="new-password" placeholder="Még egyszer" minlength="8" required aria-label="Új jelszó még egyszer" {{disabled}}>
  </div>
  <button {{disabled}}>Mentés és belépés</button>
  <div class="hint">Legalább 8 karakter. Később a Beállításokban módosíthatod.</div>
  <div class="err" role="alert">{{error}}</div>
</form>
</body></html>
