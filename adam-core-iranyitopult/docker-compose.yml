version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: adam-core-iranyitopult_web_1
      APP_PORT: 8080
      # Has its own password (set on first open), so the Umbrel login is not needed.
      PROXY_AUTH_ADD: "false"

  web:
    image: node:22-alpine
    restart: on-failure
    stop_grace_period: 5s
    user: "1000:1000"
    working_dir: /app
    command: ["node", "/app/server.mjs"]
    environment:
      NODE_ENV: production
      TZ: Europe/Budapest
      DATA_DIR: /data
      # The website app's internal port (statistics, health, discount places). Not published anywhere.
      SITE_INTERNAL: http://adam-admcore_web_1:9095
    volumes:
      - ${APP_DATA_DIR}/app:/app:ro
      - ${APP_DATA_DIR}/data:/data
