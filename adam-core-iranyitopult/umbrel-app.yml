releaseNotes: >-
  Új „Adó” fül: bevételi nyilvántartás személyenként (Orosz Ádám, Kánya Márk), letölthető CSV-ben; becsült SZJA, TB-járulék és szocho átalányadóval (kiegészítő vagy főállású); figyeli az adómentes részt, az alanyi ÁFA-mentesség és az átalányadó határát; a szokásos adóhatáridők listája, és ntfy-emlékeztető egy héttel és egy nappal előtte. A számítás becslés, a NAV-nál érdemes megerősíteni.
