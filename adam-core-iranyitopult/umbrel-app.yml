releaseNotes: >-
  Új gomb a Beállítások › Adatok részben: „Összes adat törlése…” – kiválaszthatod, hogy a kéréseket, az Adó fül bevételeit és a Stripe-beállításokat töröld; a törlés előtt automatikusan mentés készül. Javítva: ha még nem volt beírt bevétel, az Adó fül nem tudott megjelenni, ezért a Beállítások maradt a képernyőn. Az Adó fül új megjelenést is kapott (összesítő számok felül, személyenkénti kártyák, a beállítások külön ablakban), és a telefon már nem tölthet be régi, gyorsítótárazott szkriptet. A „kiegészítő” helyett „mellékállású” a pontos megnevezés (Tbj. 42. § (2)). A weboldal alapcíme zalastudio.hu.
