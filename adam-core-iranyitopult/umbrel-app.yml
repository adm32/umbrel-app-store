releaseNotes: >-
  2.1.0 – az online fizetés újra be van kapcsolva: fizetési link az ügyfél lapján, Stripe-beállítások, havi bevétel, sikertelen fizetések és a „Kiszámlázandó” lista, mellette gyorslink a Számlázz.hu-ra.
  2.0.1 – új telepítésnél alapból „ÁFA nélkül” az árak beállítása, és az Adó fülön a vállalkozás kezdete 2026. 11. 12.
  2.0.0 – gyorsabb megnyitás. Az app programja tömörítve érkezik (85 kB helyett kb. 26 kB), és a
  következő frissítésig a telefonon marad. Az oldal maga is tömörítve jön, a betűk kisebb fájlból
  töltődnek. A nem használt kódrészek kikerültek.
