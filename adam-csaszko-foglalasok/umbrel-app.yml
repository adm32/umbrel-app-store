releaseNotes: >-
  3.0.1 – apró takarítás, nem használt stílus törölve.
  3.0.0 – gyorsabb kezelőfelület. Az app fájljai tömörítve érkeznek (kb. negyedakkora letöltés), és
  ha nem változtak, a telefon nem tölti le őket újra. Az „értesítés nincs beállítva” figyelmeztetés
  mostantól csak a Foglalások fülön látszik, a többi fülön nem foglalja a helyet.
