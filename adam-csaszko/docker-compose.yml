version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service>_1
      APP_HOST: adam-csaszko_web_1
      APP_PORT: 8080
      # public website: visitors must NOT get the Umbrel login
      PROXY_AUTH_ADD: "false"

  web:
    build:
      context: ${APP_DATA_DIR}
    # Rebuilt on every start, so after an update the new program really runs.
    pull_policy: build
    restart: on-failure
    stop_grace_period: 5s
    user: "1000:1000"
    environment:
      TZ: Europe/Budapest
      # The booking app's public API over Umbrel's internal network (install Csaszko Foglalások).
      BOOKING_API: http://adam-csaszko-foglalasok_web_1:3001
