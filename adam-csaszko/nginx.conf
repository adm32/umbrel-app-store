# Csaszko Barbershop – static one-page site (runs inside the Umbrel app container)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # behind Umbrel's app proxy and the Cloudflare tunnel: keep redirects relative
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json text/plain font/woff;

    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

    location / {
        try_files $uri $uri/ @home;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy $csp always;
    }

    # Online booking → the "Csaszko Foglalások" app (public booking API on port 4772).
    # If that app isn't installed or running, the site falls back to demo mode and the phone number.
    location ^~ /api/ {
        proxy_pass http://host.docker.internal:4772;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        client_max_body_size 32k;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # fonts and icons rarely change
    location ~* \.(?:svg|woff|woff2|png|webp|jpg|jpeg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # unknown addresses go to the front page
    location @home { return 302 /; }
}
