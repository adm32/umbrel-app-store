manifestVersion: 1
id: adam-csaszko
category: social
name: Csaszko Barbershop
version: "2.0.2"
tagline: A Csaszko Barbershop weboldala, Zalaszentgrót
icon: https://raw.githubusercontent.com/adm32/umbrel-app-store/main/adam-csaszko/icon.svg
description: >-
  Website of Csaszko Barbershop (Császár Bence, Zalaszentgrót, Nefelejts u. 1.):
  prices with durations, online booking, opening hours, location, TikTok and
  Instagram. Hungarian, phone-first, no cookies, fonts served locally. A small Go program
  (no nginx), the site is compiled into it.


  Bookings, free times, services and prices come from the "Csaszko Foglalások"
  app (install it too). If that app is not running, the site shows the built-in
  price list and asks visitors to call.


  To publish it, point a Cloudflare Tunnel public hostname (for example
  csaszko.admcore.hu) at http://<umbrel-ip>:4770.
developer: Adam
