  form. Hungarian, phone-first, no cookies, fonts served locally.


  The appointment form is in demo mode: it shows the confirmation but sends
  nothing yet.


  To share it, point a Cloudflare Tunnel public hostname (for example
  csaszko.admcore.hu) at http://<umbrel-ip>:4770.
