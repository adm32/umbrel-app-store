releaseNotes: >-
  3.0.0 – gyorsabb és nyugodtabb oldal. A betűk kisebb fájlból töltődnek (WOFF2), a stíluslap és a
  program egy évig a böngészőben marad (a címük változik, ha frissül). Javítás: a nyitóképen a szabad
  időpontok betöltésekor már nem ugrik meg az oldal. Nagyobb koppintható terület az Instagram-névnél
  és a lábléc hivatkozásánál.
