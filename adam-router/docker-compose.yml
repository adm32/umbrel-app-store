version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: adam-router_web_1
      APP_PORT: 8080

  web:
    image: nginx:1.27-alpine
    restart: on-failure
    environment:
      # Router address on the Umbrel's LAN (its default gateway).
      ROUTER_HOST: "10.0.0.1"
      # "http" or "https", whichever the router's admin page uses.
      ROUTER_SCHEME: "http"
    volumes:
      - ${APP_DATA_DIR}/data/default.conf.template:/etc/nginx/templates/default.conf.template:ro
