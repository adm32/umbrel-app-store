version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service>_1
      APP_HOST: adam-szikra_web_1
      APP_PORT: 8080
      # Personal study app: Umbrel's login screen stays ON (default).

  web:
    build:
      context: ${APP_DATA_DIR}
    # Rebuilt on every start, so after an update the new program really runs.
    pull_policy: build
    restart: on-failure
    stop_grace_period: 5s
    user: "1000:1000"
    environment:
      TZ: Europe/Budapest
      DATA_DIR: /data
      PORT: "8080"
      # Same app with its own password, for a Cloudflare Tunnel hostname (szikra.admcore.hu).
      # Stays locked until a password is set from the Umbrel address (profile page).
      REMOTE_PORT: "8082"
    ports:
      - "4781:8082"
    volumes:
      - ${APP_DATA_DIR}/data:/data
