  1.1.0 – mindenkinek saját tananyag (az Ady-anyag csak Ádámé, Hanna üres kezdőképernyőt kap); jelszavas nyilvános cím (4781-es port, pl. szikra.admcore.hu), a jelszót a profiloldalon lehet beállítani.
  1.0.0 – első kiadás: Ady Endre (10 témakör, 41 vers, 447 kártya, 4 memoriter-edző), napi kör, ismétlés, XP, kombó, széria, jelvények, visszaszámlálás a csütörtöki dolgozatig. Profilok: Ádám (maci) és Hanna (nyuszi, pink téma), külön haladással.
