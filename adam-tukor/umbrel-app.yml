releaseNotes: >-
  1.0.1 – javítva: az „Átvétel most” és az „Új kód” gomb a megerősítés után nem csinált semmit.
  1.0.0 – első kiadás. Két Umbrel együtt: a tartalék 15 másodpercenként átmásolja az oldalak adatait
  (beállítások és Stripe-kulcsok is), minden kérést a fő szervernek ad tovább, és ha a fő ~30
  másodpercig nem érhető el, átveszi az oldalakat. Ha a fő visszajön, egy perc után visszaadja a
  közben változott adatokat (rendelések, foglalások). Napi mentés a tartalékon, ütközések kijelzése.
