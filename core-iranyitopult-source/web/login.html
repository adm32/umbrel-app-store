<!doctype html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Irányítópult">
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/auth.css">
<title>Belépés – Zala Studio Irányítópult</title>
</head><body>
<form method="post" action="/login">
  <img class="ic" src="/icon.svg" alt="">
  <h1>Zala Studio Irányítópult</h1>
  <p>Érdeklődők és látogatók egy helyen.</p>
  <div class="grp"><input type="password" name="jelszo" autocomplete="current-password" placeholder="Jelszó" required autofocus aria-label="Jelszó"></div>
  <button>Belépés</button>
  <div class="err" role="alert">{{error}}</div>
</form>
</body></html>
